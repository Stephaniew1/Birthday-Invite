<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- "viewport-fit=cover" helps fill entire screen on iPhones with notches.
       "user-scalable=no" optional for an app-like feel. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <title>Secret Birthday Invite</title>

    <!-- Optional: Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            /* Prevent background scroll bounce on iOS */
            font-family: Arial, sans-serif;
        }

        /* Save-the-Date Overlay (Lock Screen Style) */
        .save-the-date {
            position: fixed;
            inset: 0;
            /* top:0;right:0;bottom:0;left:0 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #fff;
            color: black;
            z-index: 9999;
            transition: opacity 0.8s ease-in-out;
            cursor: pointer;
        }

        .time {
            font-size: 80px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .date {
            font-size: 20px;
            opacity: 0.8;
            margin-bottom: 40px;
        }

        .notification {
            background: white;
            padding: 15px;
            width: 90%;
            max-width: 400px;
            border-radius: 15px;
            text-align: left;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border: 1px solid #ddd;
        }

        .notif-title {
            font-size: 18px;
            font-weight: bold;
        }

        .notif-text {
            font-size: 16px;
        }

        .click-to-open {
            font-size: 14px;
            color: #007aff;
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }

        /* Chat Container (Pinned like iMessage) */
        .chat-container {
            position: fixed;
            inset: 0;
            display: none;
            /* hidden until user taps overlay */
            flex-direction: column;
            max-width: 500px;
            margin: 0 auto;
            /* center horizontally if on wide screen */
            background: #fff;
            z-index: 1;
            /* behind the overlay initially */
        }

        .chat-header {
            background: #007aff;
            color: #fff;
            text-align: center;
            padding: 15px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .chat-body {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 15px;
            background: #f1f0f0;
            display: flex;
            flex-direction: column;
        }

        .chat-bubble {
            max-width: 70%;
            padding: 10px 15px;
            margin-bottom: 10px;
            border-radius: 20px;
            word-wrap: break-word;
            font-size: 16px;
        }

        .bot {
            align-self: flex-start;
            background: #e5e5ea;
            color: #000;
        }

        .user {
            align-self: flex-end;
            background: #007aff;
            color: #fff;
        }

        .chat-footer {
            flex-shrink: 0;
            background: #f8f9fa;
            border-top: 1px solid #ddd;
            display: flex;
            align-items: center;
            padding: 10px;
            /* Safe area to remove bottom gap on iPhone (with home indicator) */
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
            padding-bottom: calc(10px + constant(safe-area-inset-bottom));
        }

        .chat-footer input {
            flex: 1;
            border: none;
            border-radius: 20px;
            padding: 10px;
            font-size: 16px;
            outline: none;
        }

        .chat-footer button {
            margin-left: 10px;
            border-radius: 20px;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <!-- Save the Date Overlay -->
    <div class="save-the-date" onclick="showChat()">
        <div class="time" id="current-time">1:02</div>
        <div class="date" id="current-date">Monday, February 10</div>

        <div class="notification">
            <div class="notif-title">SAVE THE DATE 🎉</div>
            <div class="notif-text">Wanjiru's 60th Surprise Birthday</div>
            <div class="click-to-open">Tap to open</div>
        </div>
    </div>

    <!-- Chat Container -->
    <div class="chat-container" id="chatContainer">
        <div class="chat-header">
            🎉 Secret Birthday Chat 🎉
        </div>

        <div class="chat-body" id="chatBody">
            <!-- Messages appended here by JavaScript -->
        </div>

        <div class="chat-footer">
            <input type="text" id="chatInput" placeholder="Type your message..."
                onkeydown="if(event.key === 'Enter') sendMessage()">
            <button class="btn btn-primary" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <!-- Optional Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
    </script>

    <script>
        // 1) Fade out "Save the Date" screen, show chat
        function showChat() {
            const overlay = document.querySelector('.save-the-date');
            overlay.style.opacity = '0'; // fade out
            setTimeout(() => {
                overlay.style.display = 'none';
                document.getElementById('chatContainer').style.display = 'flex';
                // Trigger the chat's initial state by sending "secret"
                sendToServer('secret');
            }, 800);
        }

        // 2) Dynamic Clock
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let mins = now.getMinutes();
            hours = hours % 12 || 12;
            if (mins < 10) mins = '0' + mins;
            document.getElementById("current-time").innerText = hours + ":" + mins;
            document.getElementById("current-date").innerText = now.toLocaleDateString('en-US', {
                weekday: 'long', month: 'long', day: 'numeric'
            });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 3) Send user message
        async function sendMessage() {
            const inputEl = document.getElementById('chatInput');
            const msg = inputEl.value.trim();
            if (!msg) return;

            // Add user bubble
            appendBubble(msg, 'user');
            inputEl.value = '';

            // Send to backend
            await sendToServer(msg);
        }

        // 4) POST to /chat with AJAX
        async function sendToServer(text) {
            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                // data.reply -> the bot's message with HTML
                appendBubble(data.reply, 'bot');
            } catch (err) {
                console.error(err);
                appendBubble("Oops, something went wrong. Please try again.", 'bot');
            }
        }

        // 5) Append a bubble using innerHTML to allow <br> & <strong>
        function appendBubble(message, sender) {
            const chatBody = document.getElementById('chatBody');
            const bubble = document.createElement('div');
            bubble.classList.add('chat-bubble', sender);
            bubble.innerHTML = message; // <-- Use innerHTML so bold & line breaks render
            chatBody.appendChild(bubble);
            // Auto-scroll to bottom
            chatBody.scrollTop = chatBody.scrollHeight;
        }
    </script>
</body>

</html>
